appId: it.amatori.classifica
productName: Tornei e partite interne tennistavolo
directories:
  buildResources: build
  output: dist
# Solo le traduzioni dell'interfaccia Chromium che servono: -40 MB circa.
electronLanguages:
  - it
  - en-US
files:
  - out/**
  - package.json
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: Tornei e partite interne tennistavolo
  artifactName: TennistavoloAmatori-Setup-${version}.exe
portable:
  artifactName: TennistavoloAmatori-Portable-${version}.exe
